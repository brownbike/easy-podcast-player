name: epp
description: "Kids podcast app — single-user, whitelisted feeds only."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.4
  cached_network_image: ^3.4.1
  http: ^1.2.0
  xml: ^6.5.0
  intl: ^0.20.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  shared_preferences: ^2.3.2
  background_downloader: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.1.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
